spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6370
  cache: 
    type: none   

app:
  jwt:
    secret: TestSecretKeyForJWTSigningThatIsAtLeast512BitsLongForTestingPurposesOnlyDoNotUseInProd!!
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
   
resilience4j:
      ratelimiter:
        instances:
          loginRateLimit:
            limit-for-period: 1000
            limit-refresh-period: 1s
            timeout-duration: 0